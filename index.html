function poseOf(F){

  if(k<m.s)p=lp(B,W1,ease(k/m.s));

  else p=lp(H1,B,ease(clamp((k-m.s-m.a)/m.r,0,1)));
  const act=k>=m.s&&k<m.s+m.a;
  if(m.spinFx&&act){p.wa=1.57+(k-m.s)*.55;p.fa1=p.wa;p.fa2=p.wa}
  if(m.flurry&&act){const q=Math.sin((k-m.s)*1.2);p.wa=1.57+q*1.2;p.fa2=1.4+q*.8;p.ba2=1.6-q*.8}

 }

 const p=Object.assign({},B);
 if(a==='walk'){const ph=k*.22,sn=Math.sin(ph);p.fl1=sn*.55;p.fl2=p.fl1-.45*Math.max(0,Math.sin(ph+1.6));p.bl1=-sn*.55;p.bl2=p.bl1-.45*Math.max(0,-Math.sin(ph+1.6));

 netReset();if(typeof Peer==='undefined'){say('Online geht nicht: kein Internet?');return}
 NET.role='host';NET.slot=0;NET.code=genCode();NET.status='Verbinde mit Server...';
 const p=new Peer('davud-'+NET.code,{config:ICE,debug:0});NET.peer=p;
 p.on('open',()=>{NET.status='Raum offen - warte auf Spieler'});
 p.on('connection',c=>{
  const slot=[1,2].find(s=>!NET.conns[s]);
  if(!slot||scene==='fight'||scene==='waves'||scene==='stats'){c.on('open',()=>{try{c.send({t:'full'})}catch(e){}setTimeout(()=>c.close(),400)});return}
  NET.conns[slot]=c;
  c.on('open',()=>{c.send({t:'welcome',slot,code:NET.code});sel.present[slot]=true;sel.lock[slot]=false;sel.c[slot]=[1,2][slot-1]===sel.c[0]?3:slot;sel.pv[slot]=mkPrev(sel.c[slot]);sfx('select');djSay('Neuer Gast! Mehr Leute, mehr Party!');broadcastLobby()});
  c.on('data',d=>onHostData(slot,d));c.on('close',()=>dropGuest(slot,c));c.on('error',()=>dropGuest(slot,c))});
 p.on('error',e=>{if(e.type==='unavailable-id'){try{p.destroy()}catch(_){}hostRoom();return}NET.status='Fehler: '+e.type+' (Internet?)'});

 const p=new Peer({config:ICE,debug:0});NET.peer=p;
 p.on('open',()=>{NET.status='Suche Raum '+NET.code+'...';const c=p.connect('davud-'+NET.code,{reliable:true,serialization:'json'});NET.host=c;

 if(online&&host&&NET.status&&!NET.status.startsWith('Raum offen'))txt(NET.status,W/2,40,8,'#ff9a80','center');
 if(toast&&toast.l>0){ctx.fillStyle='rgba(60,10,20,.88)';ctx.fillRect(80,150,320,16);txt(toast.t,W/2,154,8,'#ffb0b0','center')}
}

// ---------------------------------------------------------- HAUPTSCHLEIFE
function step(){
 sfxCount=0;
 for(const b of bubbles){b.y+=b.vy;if(b.y<-4){b.y=H+4;b.x=Math.random()*660-90}}
 for(const p of parts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.l--;if(p.g>0&&p.y>=p.gy){p.y=p.gy;p.vx=0;p.vy=0}}
 parts=parts.filter(p=>p.l>0);if(parts.length>700)parts.splice(0,parts.length-700);
 for(const t of texts){t.y-=.45;t.l--}texts=texts.filter(t=>t.l>0);if(texts.length>60)texts.splice(0,texts.length-60);
 for(const f of fxs)f.l--;fxs=fxs.filter(f=>f.l>0);
 if(shake>0)shake=Math.max(0,shake-.5);
 if(scene==='waves'&&Wv&&tick%3===0)for(const p of Wv.P)if(p&&!p.gone&&!p.down&&vis(p,'aura')>0){const a=Math.random()*6.28;parts.push({x:p.x+Math.cos(a)*15,y:p.y+Math.sin(a)*7,vx:rnd(-.2,.2),vy:rnd(-.9,-.4),l:rnd(14,24),c:Math.random()<.5?'#ff8a30':'#ffd060',s:1,g:-.01,gy:999})}
 MUS.want=scene==='fight'||scene==='waves'?'battle':'menu';
 if(scene==='menu')stepMenu();else if(scene==='controls')stepControls();else if(scene==='online')stepOnline();else if(scene==='joining')stepJoining();
 else if(scene==='select')stepSelect();else if(scene==='fight'&&G)stepFight();else if(scene==='waves'&&Wv)stepWaves();else if(scene==='stats')stepStats();
}
function touchOverlay(){
 if(scene==='fight'&&G&&!(mode==='guest'&&NET.spect)){const F=G.F[mode==='guest'?1:0];drawTouch(id=>id==='special'?1-F.cd/CHARS[F.ci].cd:id==='ult'?F.ult/100:1)}
 else if(scene==='waves'&&Wv&&!overlayUp()){const me=Wv.P[mySlot()];if(me&&!me.down&&!me.gone)drawTouch(id=>id==='special'?1-me.cd/Math.max(1,me.cdm):id==='dash'?1-me.dcd/60:id==='build'?(me.coins>=30?1:.001):id.length===2&&id[0]==='b'?(me.coins>=TWD[TWK[+id[1]]].c?1:.001):1)}}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,CW,H);ctx.setTransform(1,0,0,1,OX,0);
 if(scene==='menu')drawMenu();else if(scene==='controls')drawControls();else if(scene==='online')drawOnline();else if(scene==='joining')drawJoining();
 else if(scene==='select')drawSelect();else if(scene==='fight'&&G)drawFight();else if(scene==='waves'&&Wv)drawWaves();else if(scene==='stats')drawStats();
 touchOverlay()}
let last=performance.now(),acc=0;const DT=1000/60;
function frame(now){acc+=Math.min(100,now-last);last=now;
 while(acc>=DT){acc-=DT;try{step()}catch(e){console.error(e)}tick++;pressed.clear();mouse.click=false;mouse.moved=false}
 try{draw()}catch(e){console.error(e)}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
{const q=new URLSearchParams(location.search).get('raum');if(q)setTimeout(()=>joinRoom(q),300)}
</script>
